[project]
name = "clip_scribe"
version = "1.0.0"
requires-python = ">=3.12"

# Main project dependencies: the full stack a developer needs to run the core
# pipeline locally (`uv sync`). The container images install narrower slices of
# this set — the slim API image via the `[dependency-groups].api` group
# (`--only-group api`, which EXCLUDES these base deps), and the heavy Celery
# worker images by reusing these base deps plus exactly one torch selector extra
# (`worker-cpu`/`worker-gpu`) to pick the CPU or CUDA wheel source.
dependencies = [
    "colorlog>=6.10.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "opencv-python>=4.13.0.90",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers",
    "supervision>=0.22.0",
    "paddleocr>=2.0.1",
    "scikit-learn>=1.8.0",
    "spacy>=3.8.11",
    "scenedetect>=0.6.7.1",
    "python-dotenv>=1.2.1",
    "openai-agents>=0.7.0",
    "pydantic>=2.12.5",
    "nltk>=3.9.2",
    "sentence-transformers>=5.2.2",
    "facenet-pytorch>=2.5.3",
    "openai-whisper>=20250625",
    "paddlepaddle",
    "addict",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    # yapf IS a runtime dep, not formatter-only tooling: the vendored
    # GroundingDINO code imports it (src/dino/groundingdino/util/slconfig.py).
    # Do not move it to the dev extra — model loading would break.
    "yapf",
    "pycocotools",
    "timm",
    "PyYAML==6.0.3",
    "types-PyYAML",
    "sqlalchemy>=2.0.0",
    "alembic>=1.18.5",
    "python-ulid>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "openpyxl>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "google-cloud-storage>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "pre-commit==4.2.0",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "httpx>=0.27.0",
    "fakeredis>=2.20.0"
]
# Torch selector extras for the Celery worker container images
# (backend/docker/core/{cpu,gpu}). Each pins the linux/x86_64 CPU or CUDA-12.6
# Torch/Torchvision wheels; combined with `[tool.uv.sources]` below, enabling one
# extra redirects the base-dep torch to the matching index. The worker Dockerfiles
# install `uv sync --no-install-project --extra worker-cpu` (or `worker-gpu`),
# i.e. the base deps above with one of these extras layered on. The two extras are
# mutually exclusive (see `[tool.uv].conflicts`).
worker-cpu = [
    "torch==2.9.1+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.24.1+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
worker-gpu = [
    "torch==2.9.1+cu126; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.24.1+cu126; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
conflicts = [
    [
        { extra = "worker-cpu" },
        { extra = "worker-gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "worker-cpu" },
    { index = "pytorch-cu126", extra = "worker-gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "worker-cpu" },
    { index = "pytorch-cu126", extra = "worker-gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Dependency set for the slim API container image (backend/docker/api, web-app-plan §8).
# Install with `uv sync --only-group api` — unlike an extra, --only-group
# EXCLUDES the heavy main dependencies (paddleocr/whisper/sam2/dino/opencv), so
# the API image never pulls the pipeline ML stack. It DOES include the
# advisory-chat LLM libraries (`langgraph`, `langchain-openai`) plus `openpyxl`
# so the API can serve chat and ABCD export routes.
[dependency-groups]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.18.5",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-ulid>=3.1.0",
    "PyYAML==6.0.3",
    "psycopg2-binary>=2.9.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "openpyxl>=3.1.0",
    "google-cloud-storage>=2.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sam2.*",
    "dino.*",
    "groundingdino.*",
    "utils.sam2_utils",
    "utils.position_encoding",
    "utils.misc",
    "src.sam2.*",
    "src.dino.*"
]
ignore_errors = true
follow_imports = "skip"
