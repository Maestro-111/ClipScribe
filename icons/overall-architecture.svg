<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ClipScribe overall architecture</title>
  <desc id="desc">A high-level architecture diagram showing the React dashboard, FastAPI, inline and Celery execution paths, the ClipScribe engine, model services, database, Redis, and local or GCS storage.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, ui-sans-serif, system-ui, sans-serif; fill: #fff; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #bfdbfe; }
      .lane { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: 1.5px; }
      .card-title { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .card-copy { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .small-title { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small-copy { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .label { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .white-title { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #fff; }
      .white-copy { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #dbeafe; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .event { fill: none; stroke: #2563eb; stroke-width: 2.3; stroke-dasharray: 8 7; marker-end: url(#arrowBlue); }
      .dependency { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" rx="24" fill="#f8fafc"/>
  <path d="M24 0h1552a24 24 0 0 1 24 24v116H0V24A24 24 0 0 1 24 0z" fill="url(#header)"/>
  <g transform="translate(64 42)">
    <rect width="54" height="54" rx="13" fill="#fff" fill-opacity="0.12"/>
    <rect x="11" y="13" width="32" height="9" rx="2" fill="#fff"/>
    <path d="M17 12l-3 11m12-11-3 11m12-11-3 11" stroke="#1e3a8a" stroke-width="2.5"/>
    <rect x="11" y="25" width="32" height="18" rx="3" fill="#fff"/>
    <path d="M17 31h17M17 37h11" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="140" y="65" class="title">ClipScribe system architecture</text>
  <text x="140" y="99" class="subtitle">One web contract · interchangeable execution · multimodal processing · durable results</text>
  <g transform="translate(1270 48)">
    <circle cx="8" cy="8" r="6" fill="#60a5fa"/>
    <text x="23" y="13" class="subtitle">REST / work</text>
    <path d="M0 37h34" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="46" y="42" class="subtitle">events</text>
  </g>

  <text x="54" y="181" class="lane">EXPERIENCE &amp; API</text>
  <line x1="54" y1="194" x2="1546" y2="194" stroke="#e2e8f0" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="70" y="228" width="180" height="132" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="110" cy="269" r="19" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="110" cy="262" r="6" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M98 281c3-9 21-9 24 0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="139" y="270" class="card-title">User</text>
    <text x="91" y="312" class="card-copy">Upload · submit</text>
    <text x="91" y="337" class="card-copy">inspect · chat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="218" width="260" height="152" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="354" y="242" width="46" height="37" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <path d="M354 289h46M367 289l-7 12m27-12 7 12" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="419" y="258" class="card-title">React dashboard</text>
    <text x="419" y="283" class="card-copy">Vite · TanStack</text>
    <text x="354" y="326" class="card-copy">Jobs · live progress · run inspector</text>
    <text x="354" y="350" class="card-copy">exports · advisory chat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="684" y="208" width="282" height="172" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="708" y="232" width="48" height="48" rx="12" fill="#dbeafe"/>
    <path d="M720 245h24m-24 10h24m-24 10h15" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="775" y="251" class="card-title">FastAPI</text>
    <text x="775" y="277" class="card-copy">REST + server-sent events</text>
    <text x="708" y="317" class="card-copy">Uploads · batch/child jobs · run reads</text>
    <text x="708" y="342" class="card-copy">lifecycle · artifacts · chat · exports</text>
  </g>

  <path d="M250 294H330" class="flow-blue"/>
  <text x="269" y="282" class="label">browser</text>
  <path d="M590 294H684" class="flow-blue"/>
  <text x="608" y="282" class="label">/api</text>

  <g filter="url(#shadow)">
    <rect x="1072" y="218" width="206" height="152" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <path d="M1101 249c0-9 14-16 32-16s32 7 32 16v42c0 9-14 16-32 16s-32-7-32-16z" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="1133" cy="249" rx="32" ry="16" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <path d="M1101 270c0 9 14 16 32 16s32-7 32-16" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="1183" y="256" class="small-title">SQL</text>
    <text x="1183" y="279" class="small-copy">PostgreSQL</text>
    <text x="1183" y="299" class="small-copy">or SQLite</text>
    <text x="1098" y="340" class="small-copy">jobs · runs · results · chat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1322" y="218" width="208" height="152" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <path d="M1351 255h64l-8 54h-48z" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <path d="M1361 255l8-13h28l8 13" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="1428" y="260" class="small-title">Storage</text>
    <text x="1428" y="283" class="small-copy">local or GCS</text>
    <text x="1348" y="340" class="small-copy">videos · run artifacts</text>
  </g>

  <path d="M966 262H1072" class="dependency"/>
  <path d="M966 324H1322" class="dependency"/>

  <text x="54" y="435" class="lane">JOB ORCHESTRATION</text>
  <line x1="54" y1="448" x2="1546" y2="448" stroke="#e2e8f0" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="228" y="487" width="286" height="140" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="258" y="525" class="card-title">Job service</text>
    <text x="258" y="555" class="card-copy">Validate + persist parent batch</text>
    <text x="258" y="580" class="card-copy">Fan out one child + run per video</text>
    <rect x="258" y="598" width="152" height="24" rx="12" fill="#eff6ff"/>
    <text x="272" y="615" class="small-copy" fill="#1d4ed8">common HTTP contract</text>
  </g>
  <path d="M825 380V415H371V487" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="612" y="478" width="264" height="158" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <text x="642" y="516" class="card-title">Dispatch</text>
    <rect x="642" y="539" width="202" height="35" rx="17" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="662" cy="556" r="6" fill="#2563eb"/>
    <text x="678" y="561" class="small-title">Inline</text>
    <text x="747" y="561" class="small-copy">single slot</text>
    <rect x="642" y="587" width="202" height="35" rx="17" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="662" cy="604" r="6" fill="#f97316"/>
    <text x="678" y="609" class="small-title">Celery</text>
    <text x="748" y="609" class="small-copy">queued</text>
  </g>
  <path d="M514 557H612" class="flow-blue"/>

  <g filter="url(#shadow)">
    <rect x="973" y="478" width="292" height="158" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="1003" y="516" class="card-title">Execution process</text>
    <text x="1003" y="547" class="card-copy">API thread executor</text>
    <text x="1003" y="572" class="card-copy">or model-loaded Celery worker</text>
    <path d="M1010 598h216" stroke="#e2e8f0"/>
    <text x="1003" y="620" class="small-copy">long-lived builder · one job at a time</text>
  </g>
  <path d="M876 557H973" class="flow-blue"/>

  <g filter="url(#shadow)">
    <rect x="1348" y="478" width="182" height="158" rx="18" fill="#fff" stroke="#fdba74" stroke-width="2"/>
    <path d="M1381 521c21-10 43-10 64 0-21 10-43 10-64 0zm0 28c21-10 43-10 64 0-21 10-43 10-64 0zm0 28c21-10 43-10 64 0-21 10-43 10-64 0z" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="1461" y="528" class="small-title">Redis</text>
    <text x="1461" y="552" class="small-copy">queue</text>
    <text x="1461" y="574" class="small-copy">events</text>
    <text x="1461" y="596" class="small-copy">cancel</text>
  </g>
  <path d="M844 604H912V663H1439V636" class="dependency"/>
  <path d="M1348 513H1265" class="dependency"/>

  <text x="54" y="697" class="lane">CORE PIPELINE</text>
  <line x1="54" y1="710" x2="1546" y2="710" stroke="#e2e8f0" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="165" y="752" width="282" height="166" rx="20" fill="url(#core)"/>
    <text x="197" y="793" class="white-title">run_job_core</text>
    <text x="197" y="824" class="white-copy">materialize source · mark status</text>
    <text x="197" y="850" class="white-copy">build engine · run · release source</text>
    <path d="M197 873h218" stroke="#93c5fd" stroke-opacity="0.7"/>
    <text x="197" y="898" class="white-copy">shared by both execution modes</text>
  </g>
  <path d="M1119 636V679H306V752" class="flow-blue"/>

  <g filter="url(#shadow)">
    <rect x="523" y="752" width="258" height="166" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <text x="555" y="793" class="card-title">ClipScribe engine</text>
    <text x="555" y="824" class="card-copy">1. extract + publish artifacts</text>
    <text x="555" y="850" class="card-copy">2. persist structured run</text>
    <text x="555" y="876" class="card-copy">3. parse + persist evaluation</text>
    <text x="555" y="902" class="small-copy">progress emitted throughout</text>
  </g>
  <path d="M447 835H523" class="flow-blue"/>

  <g filter="url(#shadow)">
    <rect x="856" y="752" width="290" height="166" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="888" y="793" class="card-title">Multimodal intelligence</text>
    <text x="888" y="824" class="card-copy">OpenAI vision + LLM agents</text>
    <text x="888" y="850" class="card-copy">DINO · SAM2 · DINOv2 · SBERT</text>
    <text x="888" y="876" class="card-copy">Whisper · PaddleOCR · MTCNN</text>
    <text x="888" y="902" class="small-copy">loaded once by ClipScribeBuilder</text>
  </g>
  <path d="M781 813H856" class="dependency"/>

  <g filter="url(#shadow)">
    <rect x="1222" y="752" width="308" height="166" rx="20" fill="#fff" stroke="#86efac" stroke-width="2"/>
    <text x="1254" y="793" class="card-title">Durable outputs</text>
    <text x="1254" y="824" class="card-copy">normalized extraction records</text>
    <text x="1254" y="850" class="card-copy">platform evaluation results</text>
    <text x="1254" y="876" class="card-copy">tracked video + debug artifacts</text>
    <text x="1254" y="902" class="small-copy">served back to dashboard + chat</text>
  </g>
  <path d="M781 879H818V940H1376V918" class="flow"/>
  <path d="M1376 752V696H1175V370" class="dependency"/>
  <path d="M1426 752V696H1510V370" class="dependency"/>

  <path d="M523 785H479V678H1439V636" class="event"/>
  <path d="M1439 478V406H825V380" class="event"/>
  <text x="935" y="397" class="label" fill="#1d4ed8">Redis Stream → SSE progress and logs</text>
</svg>
