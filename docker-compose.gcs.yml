# GCS storage overlay for the local stack.
#
# Layer this on top of docker-compose.yml when CLIPSCRIBE_STORAGE_BACKEND=gcs,
# to give the api + worker the host's Application Default Credentials so they
# can sign URLs and read/write the bucket:
#
#     gcloud auth application-default login --impersonate-service-account=<SA_EMAIL>
#     docker compose -f docker-compose.yml -f docker-compose.gcs.yml up
#
# The impersonation flag matters: plain user ADC has no private key and cannot
# sign v4 URLs. Impersonated ADC signs through IAM signBlob as <SA_EMAIL>, which
# therefore needs the bucket roles, and your account needs
# roles/iam.serviceAccountTokenCreator on it.
#
# Kept separate from the base file so the default (local storage) stack never
# requires the ADC file — a missing bind source would otherwise be silently
# created as an empty directory on the host.
#
# The host's ~/.config/gcloud/application_default_credentials.json is mounted
# read-only (it holds a refresh token — treat it as a secret) and
# GOOGLE_APPLICATION_CREDENTIALS is pinned to the in-container path. Set
# CLIPSCRIBE_STORAGE_BACKEND=gcs and CLIPSCRIBE_GCS_BUCKET=<bucket> in .env, and
# leave GOOGLE_APPLICATION_CREDENTIALS unset there.
#
# Prod note: on GKE/Cloud Run the attached workload identity replaces this file
# entirely (no mount); that identity needs roles/iam.serviceAccountTokenCreator
# to sign URLs (Bucket Admin alone lacks iam.serviceAccounts.signBlob).

services:
  api:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/adc.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/app/adc.json:ro

  worker:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/adc.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/app/adc.json:ro
